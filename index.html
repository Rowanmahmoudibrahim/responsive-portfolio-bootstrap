<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
    />
    
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    
    <link rel="stylesheet" href="style.css" />
    <title>Bootstrap
</title>
    <link rel="icon" type="s-image.png" href="b-image.png">

  </head>

  <body class=" ">
    <div class="border-bottom  border-danger heaad border-3 bg-white">
      <div
        class="container-fluid d-flex  align-items-center justify-content-between  "
      >
        <a href="https://startbootstrap.com/theme/personal" class="text-secondary text-decoration-none small">
          <i class="bi bi-arrow-left me-1"></i>Overview Page
        </a>
        <div class="d-none d-md-flex align-items-center gap-2">
          <button
            type="button"
            class="device-btn btn btn-light rounded-circle p-3 lh-1"
            data-width="100%"
            aria-label="Desktop view"
          >
            <i class="bi bi-display"></i>
          </button>
          <button
            type="button"
            class="device-btn btn btn-link text-secondary rounded-circle p-3 lh-1"
            data-width="768px"
            aria-label="Tablet view"
          >
            <i class="bi bi-tablet"></i>
          </button>
          <button
            type="button"
            class="device-btn btn btn-link text-secondary rounded-circle p-3 lh-1"
            data-width="375px"
            aria-label="Mobile view"
          >
          
            <i class="bi bi-phone"></i>
          </button>
        </div>
        <div class="d-flex align-items-center gap-3">
          <a href="#" class="text-dark gitimage" aria-label="GitHub"
            ><i class="bi bi-github"></i
          ></a>
          <a
            href="#"
            class="btn btn-danger-subtle bg-subtle-danger text-danger  download-btn btn-sm px-3 py-1"
          >
            <i class="bi  bi-download  me-1"></i>Free Download
          </a>
          <a href="#" class="text-secondary" aria-label="Close"
            ><i class="bi bi-x-lg"></i
          ></a>
        </div>
      </div>
    </div>
    <div id="frameWrap">
      <iframe id="previewFrame" src="home.html" title="Page preview"></iframe>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const frame = document.getElementById("previewFrame");
      const buttons = document.querySelectorAll(".device-btn");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          frame.style.width = btn.dataset.width;
          buttons.forEach((b) => {
            const isActive = b === btn;
            b.classList.toggle("btn-light", isActive);
            b.classList.toggle("btn-link", !isActive);
            b.classList.toggle("text-secondary", !isActive);
          });
        });
      });
    </script>
  </body>
</html>
